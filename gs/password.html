<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>🔒 GS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #0c110e; color: #e2e8f0; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 16px; }
    .card { background: #131a16; border: 1px solid #1e2a22; border-radius: 14px; padding: 24px; width: 100%; max-width: 360px; text-align: center; }
    .top-bar { display: flex; justify-content: flex-end; margin-bottom: 12px; }
    .lang-btn { background: #0c110e; border: 1px solid #233228; color: #94a3b8; padding: 4px 8px; border-radius: 6px; font-size: 11px; outline: none; }
    .icon { width: 44px; height: 44px; background: #17261e; color: #10b981; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 20px; margin-bottom: 12px; }
    h1 { font-size: 17px; margin-bottom: 6px; }
    p { font-size: 13px; color: #94a3b8; margin-bottom: 16px; }
    input { width: 100%; padding: 11px 14px; background: #0c110e; border: 1px solid #233228; border-radius: 8px; color: #fff; font-size: 14px; margin-bottom: 12px; outline: none; }
    input:focus { border-color: #10b981; }
    button { width: 100%; background: #10b981; color: #062419; border: none; padding: 11px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; }
    button:active { background: #059669; }
    .err { color: #ef4444; font-size: 12px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="top-bar">
      <select class="lang-btn" onchange="setLang(this.value)">
        <option value="es_es">Español</option>
        <option value="en_us">English (US)</option>
        <option value="ru_ru">Русский</option>
        <option value="zh_cn">简体中文 (CN)</option>
        <option value="zh_tw">繁體中文 (TW)</option>
      </select>
    </div>
    <div class="icon">🔒</div>
    <h1 id="t_title">Enlace Protegido</h1>
    <p id="t_desc">Ingresa la contraseña para acceder a /{{slug}}</p>
    {{hasError}}
    <form method="POST">
      <input type="password" id="t_input" name="password" placeholder="Contraseña..." required autofocus>
      <button type="submit" id="t_btn">Desbloquear</button>
    </form>
  </div>
  <script>
    async function loadLocale(lang) {
      try {
        var res = await fetch('/gs-files/locales/' + lang + '.json');
        if (!res.ok) {
          var fallback = await fetch('/gs-files/locales/es_es.json');
          return await fallback.json();
        }
        return await res.json();
      } catch {
        var fallback = await fetch('/gs-files/locales/es_es.json');
        return await fallback.json();
      }
    }
    async function setLang(lang) {
      localStorage.setItem('gs_lang', lang);
      document.querySelector('.lang-btn').value = lang;
      var t = await loadLocale(lang);
      var slug = '{{slug}}';
      document.getElementById('t_title').textContent = t.pwd_title || "Enlace Protegido";
      document.getElementById('t_desc').textContent = t.pwd_desc ? t.pwd_desc.replace('%s', slug) : 'Ingresa la contraseña para acceder a /' + slug;
      document.getElementById('t_input').placeholder = t.pwd_input || "Contraseña...";
      document.getElementById('t_btn').textContent = t.pwd_btn || "Desbloquear";
      var errEl = document.querySelector('.err');
      if (errEl) errEl.textContent = t.pwd_error || "Contraseña incorrecta";
    }
    var saved = localStorage.getItem('gs_lang') || 'es_es';
    setLang(saved);
  </script>
</body>
</html>
